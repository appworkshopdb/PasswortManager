<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Zurücksetzen</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#f2f4f8;font-family:-apple-system,system-ui,sans-serif;padding:24px;}
  .box{max-width:420px;text-align:center;}
  h1{font-size:20px;margin:0 0 10px;}
  p{color:#9aa3b2;font-size:14px;line-height:1.6;}
  #log{margin-top:16px;font-size:13px;color:#22c55e;white-space:pre-line;min-height:60px;}
  a.btn{display:inline-block;margin-top:14px;background:#4f7cff;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:999px;}
</style></head>
<body>
<div class="box">
  <h1>App wird zurückgesetzt…</h1>
  <p>Alter Zwischenspeicher wird vollständig entfernt. Deine gespeicherten Passwörter bleiben erhalten.</p>
  <div id="log"></div>
  <a class="btn" id="go" href="#">Bitte warten…</a>
</div>
<script>
(async function(){
  const log=(m)=>{ document.getElementById("log").textContent += m+"\n"; };
  const target = "./index.html?v=" + Date.now();
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.unregister(); }
      log("Service Worker entfernt: "+regs.length);
    }
    if("caches" in window){
      const keys=await caches.keys();
      for(const k of keys){ await caches.delete(k); }
      log("Caches geleert: "+keys.length);
    }
    log("Fertig. Öffne die neue Version…");
  }catch(e){ log("Hinweis: "+e.message); }
  const a=document.getElementById("go");
  a.href=target; a.textContent="App öffnen";
  // harte Weiterleitung, ersetzt History-Eintrag
  setTimeout(()=>{ location.replace(target); }, 1800);
})();
</script>
</body></html>
